[project]
name = "prompt2app"
version = "0.1.0"
description = "Prompt Compiler Workbench — induce optimizable DSPy signatures and generative UIs from natural-language prompts."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dspy-ai>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "litellm>=1.79",
    # MCP-apps generative UI + A2A/ADK (same stack as mcp-apps-demo / bct-hackathon)
    "fastmcp>=3.2.0",
    "mcp>=1.27.0",
    "google-adk[a2a]>=2.0.0b1",
    "a2a-sdk>=0.3.26",
    "fastembed>=0.8.0",
]

[project.scripts]
app-dev = "prompt2app.cli:app_dev"
app-start = "prompt2app.cli:app_start"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt2app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
